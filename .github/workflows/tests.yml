name: Ubuntu tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
  dsh-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r dsh_bridge/requirements.txt
      - run: PYTHONPATH=. python tests/smoke_dsh.py
      - run: docker build -f deploy/Dockerfile -t phoebe-hub-dsh:test .
      - run: docker run --rm --read-only --tmpfs /tmp:rw,nosuid,nodev,size=256m --tmpfs /home/phoebe/.cache:rw,exec,nosuid,nodev,uid=10001,gid=10001,size=128m --memory 768m --cpus 1 -e PYTHONPATH=/app -v "$PWD/tests:/tests:ro" --entrypoint python phoebe-hub-dsh:test /tests/smoke_dsh.py
